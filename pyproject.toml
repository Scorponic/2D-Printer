[project]
name = "pdf2stl"
version = "0.1.0"
description = "Convert black & white PDF pages into paper-like STL files for the Form 4L"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "manifold3d>=3.0",
]

[project.scripts]
pdf2stl = "pdf2stl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
